name: builds

on:
  schedule:
    - cron: '30 2 * * *'   # 02:30 UTC daily
  workflow_dispatch:
    inputs:
      target:
        description: 'Which build(s) to run'
        required: true
        default: 'all'
        type: choice
        options: [all, windows, android, appimage, tarball]
      android_arch:
        description: 'Android architecture (when running android)'
        required: false
        default: 'arm64-v8a'
        type: choice
        options: [arm64-v8a, armeabi-v7a, x86_64]

permissions:
  contents: write

concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: false

env:
  ARTIFACT_RETENTION: '14'

jobs:
  windows:
    name: "build: Windows"
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'windows' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refactor Electrum to Bedrock
        run: |
          python3 -c "
          import os, re
          replacements = {'ELECTRUM': 'BEDROCK', 'Electrum': 'Bedrock', 'electrum': 'bedrock'}
          for root, dirs, files in os.walk('.', topdown=True):
              if '.git' in root: continue
              for name in files + dirs:
                  filepath = os.path.join(root, name)
                  if os.path.islink(filepath):
                      target = os.readlink(filepath)
                      new_target = target
                      for old, new in replacements.items(): new_target = new_target.replace(old, new)
                      if new_target != target:
                          os.unlink(filepath)
                          os.symlink(new_target, filepath)
          for root, dirs, files in os.walk('.', topdown=False):
              if '.git' in root: continue
              for f in files:
                  if 'electrum' in f.lower():
                      new_f = f
                      for old, new in replacements.items(): new_f = new_f.replace(old, new)
                      if root == '.' and new_f == 'bedrock': new_f = 'run_bedrock'
                      os.rename(os.path.join(root, f), os.path.join(root, new_f))
              for d in dirs:
                  if 'electrum' in d.lower():
                      new_d = d
                      for old, new in replacements.items(): new_d = new_d.replace(old, new)
                      os.rename(os.path.join(root, d), os.path.join(root, new_d))
          os.makedirs('bedrock/locale', exist_ok=True)
          extensions = ('.py', '.toml', '.desktop', '.md', '.sh', '.rst', '.iss', '.spec', '.nsi', '.in')
          for root, dirs, files in os.walk('.'):
              if '.git' in root: continue
              for file in files:
                  filepath = os.path.join(root, file)
                  if os.path.islink(filepath): continue
                  if file.endswith(extensions) or file in ['setup.py', 'MANIFEST.in', 'run_bedrock']:
                      try:
                          with open(filepath, 'r', encoding='utf-8') as f: content = f.read()
                          new_content = content
                          for old, new in replacements.items(): new_content = new_content.replace(old, new)
                          if file == 'setup.py':
                              new_content = re.sub(r'scripts\s*=\s*\[[^\]]+\]', 'scripts=[\"run_bedrock\"]', new_content)
                          if new_content != content:
                              with open(filepath, 'w', encoding='utf-8') as f: f.write(new_content)
                      except Exception: pass
          for root, dirs, files in os.walk('contrib'):
              for file in files:
                  if file.endswith('.sh'):
                      sh_path = os.path.join(root, file)
                      try:
                          with open(sh_path, 'r', encoding='utf-8') as f: lines = f.readlines()
                          new_lines = [('# ' + l if any(cmd in l for cmd in ['git clean', 'git checkout', 'git reset']) else l) for l in lines]
                          with open(sh_path, 'w', encoding='utf-8') as f: f.writelines(new_lines)
                      except Exception: pass
          "

      - name: Cache Wine pip
        uses: actions/cache@v4
        with:
          path: contrib/build-wine/.cache/win*/wine_pip_cache
          key: wine-pip-${{ hashFiles('contrib/deterministic-build/*.txt', 'contrib/build-wine/**') }}

      - name: Cache Wine native lib builds (libsecp256k1, libusb, libzbar)
        uses: actions/cache@v4
        with:
          path: contrib/build-wine/.cache/win*/build
          key: wine-build-${{ hashFiles('contrib/make_libsecp256k1.sh', 'contrib/make_libusb.sh',The build failed because the shell script `/opt/bedrock/contrib/locale/build_locale.sh` was invoked without its required directory arguments, causing it to output its usage syntax and exit with code 1.

**Root Causes**

* **Missing Script Arguments (Primary Failure):** 
  The log shows `usage: /opt/bedrock/contrib/locale/build_locale.sh locale_source_dir locale_dest_dir`. The script expects two explicit positional arguments:
  1. `locale_source_dir` (Source directory for locale files)
  2. `locale_dest_dir` (Destination directory to compile/build into)
  
  Because these were omitted or evaluated to empty strings (e.g., passing uninitialized variables like `./build_locale.sh $SRC $DEST`), the script halted execution.

* **Empty Path Variable (Secondary Warning):** 
  The message `Refusing to remove current working directory` occurs right before the locale build step. A directory cleanup step (like `rm -rf` or a Git setup step) tried to delete a target path that resolved to `.` or an empty variable, preventing directory clearing.

---

**How to Fix**

1. **Locate the invocation:** Search your repository or build script (e.g., `builds.yml` or a setup script) for where `build_locale.sh` or `preparing bedrock-locale` is executed.
2. **Pass explicit arguments:** Ensure positional arguments are passed explicitly to the script:
   ```bash
   /opt/bedrock/contrib/locale/build_locale.sh /path/to/source /path/to/dest
