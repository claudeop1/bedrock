name: Refactor Electrum to Bedrock and Build

on:
  workflow_dispatch:
    inputs:
      commit_changes:
        description: 'Automatically commit renamed files back to repository'
        type: boolean
        default: true
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  refactor-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsecp256k1-dev \
            libusb-1.0-0-dev \
            python3-pyqt6 \
            pyqt6-dev-tools

      - name: Rename Files, Directories, Symlinks, and Fix Setup Scripts
        run: |
          cat << 'EOF' > refactor.py
          import os, re

          replacements = {
              "ELECTRUM": "BEDROCK",
              "Electrum": "Bedrock",
              "electrum": "bedrock",
          }

          # Step 1: Update symbolic link targets first
          for root, dirs, files in os.walk(".", topdown=True):
              if ".git" in root:
                  continue
              for name in files + dirs:
                  filepath = os.path.join(root, name)
                  if os.path.islink(filepath):
                      target = os.readlink(filepath)
                      new_target = target
                      for old, new in replacements.items():
                          new_target = new_target.replace(old, new)
                      if new_target != target:
                          os.unlink(filepath)
                          os.symlink(new_target, filepath)
                          print(f"Updated symlink target: {filepath} -> {new_target}")

          # Step 2: Rename files and directories bottom-up
          for root, dirs, files in os.walk(".", topdown=False):
              if ".git" in root:
                  continue
              for f in files:
                  if "electrum" in f.lower():
                      new_f = f
                      for old, new in replacements.items():
                          new_f = new_f.replace(old, new)
                      if root == "." and new_f == "bedrock":
                          new_f = "run_bedrock"
                      os.rename(os.path.join(root, f), os.path.join(root, new_f))
                      print(f"Renamed file: {f} -> {new_f}")
              for d in dirs:
                  if "electrum" in d.lower():
                      new_d = d
                      for old, new in replacements.items():
                          new_d = new_d.replace(old, new)
                      os.rename(os.path.join(root, d), os.path.join(root, new_d))
                      print(f"Renamed dir: {d} -> {new_d}")

          # Step 3: Replace text content across non-symlink project files
          extensions = (".py", ".toml", ".desktop", ".md", ".sh", ".rst", ".iss", ".spec", ".nsi", ".in")

          for root, dirs, files in os.walk("."):
              if ".git" in root:
                  continue
              for file in files:
                  filepath = os.path.join(root, file)
                  if os.path.islink(filepath):
                      continue
                  if file.endswith(extensions) or file in ["setup.py", "MANIFEST.in", "run_bedrock"]:
                      try:
                          with open(filepath, "r", encoding="utf-8") as f:
                              content = f.read()

                          new_content = content
                          for old, new in replacements.items():
                              new_content = new_content.replace(old, new)

                          if file == "setup.py":
                              new_content = re.sub(
                                  r"scripts\s*=\s*\[[^\]]+\]",
                                  'scripts=["run_bedrock"]',
                                  new_content
                              )

                          if new_content != content:
                              with open(filepath, "w", encoding="utf-8") as f:
                                  f.write(new_content)
                              print(f"Updated content: {filepath}")
                      except Exception as e:
                          print(f"Skipped {filepath}: {e}")
          EOF

          python3 refactor.py
          rm refactor.py

      - name: Install Bedrock Package Locally
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .

      - name: Verify Executable and Build Setup
        run: |
          if [ -f "run_bedrock" ]; then
            python3 run_bedrock --help || true
          fi

      - name: Commit and Push Refactored Code
        if: github.event.inputs.commit_changes == 'true' && github.event_name == 'workflow_dispatch'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "refactor: rename Electrum to Bedrock including symlinks"
          branch: ${{ github.ref_name }}
