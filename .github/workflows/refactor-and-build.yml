name: Refactor Electrum to Bedrock and Build Binary

on:
  workflow_dispatch:
    inputs:
      commit_changes:
        description: 'Automatically commit renamed files back to repository'
        type: boolean
        default: true
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  refactor-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsecp256k1-dev \
            libusb-1.0-0-dev \
            python3-pyqt6 \
            pyqt6-dev-tools

      - name: Rename Files, Directories, Symlinks, and Fix Setup Scripts
        run: |
          cat << 'EOF' > refactor.py
          import os, re

          replacements = {
              "ELECTRUM": "BEDROCK",
              "Electrum": "Bedrock",
              "electrum": "bedrock",
          }

          # 1. Update symbolic links
          for root, dirs, files in os.walk(".", topdown=True):
              if ".git" in root:
                  continue
              for name in files + dirs:
                  filepath = os.path.join(root, name)
                  if os.path.islink(filepath):
                      target = os.readlink(filepath)
                      new_target = target
                      for old, new in replacements.items():
                          new_target = new_target.replace(old, new)
                      if new_target != target:
                          os.unlink(filepath)
                          os.symlink(new_target, filepath)

          # 2. Rename files & dirs bottom-up
          for root, dirs, files in os.walk(".", topdown=False):
              if ".git" in root:
                  continue
              for f in files:
                  if "electrum" in f.lower():
                      new_f = f
                      for old, new in replacements.items():
                          new_f = new_f.replace(old, new)
                      if root == "." and new_f == "bedrock":
                          new_f = "run_bedrock"
                      os.rename(os.path.join(root, f), os.path.join(root, new_f))
              for d in dirs:
                  if "electrum" in d.lower():
                      new_d = d
                      for old, new in replacements.items():
                          new_d = new_d.replace(old, new)
                      os.rename(os.path.join(root, d), os.path.join(root, new_d))

          # 3. Update file contents
          extensions = (".py", ".toml", ".desktop", ".md", ".sh", ".rst", ".iss", ".spec", ".nsi", ".in")
          for root, dirs, files in os.walk("."):
              if ".git" in root:
                  continue
              for file in files:
                  filepath = os.path.join(root, file)
                  if os.path.islink(filepath):
                      continue
                  if file.endswith(extensions) or file in ["setup.py", "MANIFEST.in", "run_bedrock"]:
                      try:
                          with open(filepath, "r", encoding="utf-8") as f:
                              content = f.read()

                          new_content = content
                          for old, new in replacements.items():
                              new_content = new_content.replace(old, new)

                          if file == "setup.py":
                              new_content = re.sub(
                                  r"scripts\s*=\s*\[[^\]]+\]",
                                  'scripts=["run_bedrock"]',
                                  new_content
                              )

                          if new_content != content:
                              with open(filepath, "w", encoding="utf-8") as f:
                                  f.write(new_content)
                      except Exception:
                          pass
          EOF

          python3 refactor.py
          rm refactor.py

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pyinstaller
          python -m pip install -e .

      - name: Build Standalone Binary
        run: |
          if [ -f "bedrock.spec" ]; then
            pyinstaller --noconfirm bedrock.spec
          elif [ -f "electrum.spec" ]; then
            pyinstaller --noconfirm electrum.spec
          else
            pyinstaller --noconfirm --clean --onefile --name bedrock run_bedrock
          fi

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bedrock-linux-binary
          path: dist/
